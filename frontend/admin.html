<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick POS: Reports</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Quick POS</span>
    <div class="topbar-user">
      <span id="current-user"></span>
      <button type="button" id="logout-button" class="logout-button">Log out</button>
    </div>
  </header>
  <main class="admin">
    <h1>Reports</h1>
    <p id="message" class="message" role="alert"></p>

    <section class="report">
      <h2>Categories</h2>
      <table class="report-table">
        <thead>
          <tr><th>Category</th><th class="number">Quantity</th><th class="number">Revenue</th></tr>
        </thead>
        <tbody id="category-report"></tbody>
      </table>
    </section>

    <section class="report">
      <h2>Items</h2>
      <table class="report-table">
        <thead>
          <tr>
            <th>Item</th><th>Category</th><th class="number">Quantity</th><th class="number">Revenue</th>
          </tr>
        </thead>
        <tbody id="item-report"></tbody>
      </table>
    </section>

    <section class="report">
      <h2>Orders</h2>
      <div class="period-filter" role="group" aria-label="Period">
        <button type="button" class="period-button" data-period="today">Today</button>
        <button type="button" class="period-button" data-period="7d">Last 7 days</button>
        <button type="button" class="period-button" data-period="30d">Last 30 days</button>
      </div>
      <table class="report-table">
        <thead>
          <tr>
            <th>Order no.</th><th>Date/time</th><th>Cashier</th><th class="number">Total</th>
          </tr>
        </thead>
        <tbody id="order-list"></tbody>
      </table>
    </section>
  </main>

  <dialog id="order-dialog" class="order-dialog" aria-labelledby="order-dialog-title">
    <h2 id="order-dialog-title"></h2>
    <p id="order-dialog-info" class="order-dialog-info"></p>
    <table class="report-table">
      <thead>
        <tr>
          <th>Item</th><th class="number">Quantity</th><th class="number">Unit price</th><th class="number">Line total</th>
        </tr>
      </thead>
      <tbody id="order-dialog-lines"></tbody>
      <tfoot>
        <tr><th colspan="3">Total</th><td id="order-dialog-total" class="number"></td></tr>
      </tfoot>
    </table>
    <form method="dialog">
      <button type="submit">Close</button>
    </form>
  </dialog>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
