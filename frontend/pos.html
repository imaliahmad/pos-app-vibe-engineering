<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick POS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <span id="current-user"></span>
    <button type="button" id="logout-button">Log out</button>
  </header>
  <main class="pos">
    <section class="pos-column">
      <h2>Categories</h2>
      <div id="categories" class="button-list"></div>
    </section>
    <section class="pos-column">
      <h2>Items</h2>
      <div id="items" class="button-list"></div>
    </section>
    <section class="pos-column order">
      <h2>Order</h2>
      <div id="order-lines" class="order-lines"></div>
      <div class="order-total">
        <span>TOTAL</span>
        <span id="order-total">0.00</span>
      </div>
      <button type="button" id="save-button" class="save-button">SAVE ORDER</button>
      <p id="sale-confirmation" class="sale-confirmation"></p>
      <p id="message" class="message"></p>
    </section>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/pos.js"></script>
</body>
</html>
